apiVersion: v1
kind: Service
metadata:
  name: {{ include "travel.fullname" . }}-backend
  labels:
    {{ include "travel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.backend.type }}
  selector:
    app: {{ include "travel.fullname" . }}-backend
  ports:
    - name: http
      port: {{ .Values.service.backend.port }}
      targetPort: {{ .Values.service.backend.targetPort }}
