apiVersion: v1
kind: Service
metadata:
  name: {{ include "travel.fullname" . }}-frontend
  labels:
    {{ include "travel.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.frontend.type }}
  selector:
    app: {{ include "travel.fullname" . }}-frontend
  ports:
    - name: http
      port: {{ .Values.service.frontend.port }}
      targetPort: {{ .Values.service.frontend.targetPort }}
